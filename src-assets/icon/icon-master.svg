<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#3A5EE0"/>
      <stop offset="1" stop-color="#1C2B63"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- leveling staff (스타프) — 위/아래 4px만 살짝 둥글리고 나머지는 각진 눈금띠 -->
  <rect x="442" y="192" width="140" height="640" rx="10" fill="#F4F7FF"/>
  <rect x="442" y="272" width="140" height="80" fill="#1C2B63"/>
  <rect x="442" y="432" width="140" height="80" fill="#1C2B63"/>
  <rect x="442" y="592" width="140" height="80" fill="#1C2B63"/>
  <rect x="442" y="192" width="140" height="640" rx="10" fill="none" stroke="#0E1840" stroke-width="6" opacity="0.35"/>

  <!-- crosshair (레벨 조준선) -->
  <line x1="300" y1="512" x2="724" y2="512" stroke="#FF8A3D" stroke-width="30" stroke-linecap="round"/>
  <circle cx="300" cy="512" r="24" fill="#FF8A3D"/>
  <circle cx="724" cy="512" r="24" fill="#FF8A3D"/>
  <circle cx="512" cy="512" r="34" fill="#FF8A3D" stroke="#1C2B63" stroke-width="10"/>
</svg>
